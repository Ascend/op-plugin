name: PR-pipeline_op-plugin

concurrency:
  max: 120
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  pr_comment:
    types: [created]
    keyword: '^compile$'

  pull_request_comment:
    types: [created]
    branches: [ 'master', '26.1.0', '26.0.0', '7.3.0' ]
    comments: [ '^compile$' ]

env:
  repo: ${{ atomgit.event.repository.name }}
  pr_id: ${{ atomgit.event.pull_request.number }}
  org_name: "Ascend"
  img_master_arm: "pytorch_master_a2_aarch64_builder:20260804"
  img_2_7_1_arm: "pytorch_2.7.1_a2_aarch64_builder:20260804"
  img_2_9_0_arm: "pytorch_2.9.0_a2_aarch64_builder:20260901"
  img_2_10_0_arm: "pytorch_2.10.0_a2_aarch64_builder:20260804"
  img_2_11_0_arm: "pytorch_2.11.0_a2_aarch64_builder:20260804"
  img_2_12_0_arm: "pytorch_2.12.0_a2_aarch64_builder:20260804"
  img_2_13_0_arm: "pytorch_2.13.0_a2_aarch64_builder:20260804"
  img_master_x86: "pytorch_master_a1_x86_64_builder:20260804"
  img_2_7_1_x86: "pytorch_2.7.1_a1_x86_64_builder:20260804"
  img_2_9_0_x86: "pytorch_2.9.0_a1_x86_64_builder:20260901"
  img_2_10_0_x86: "pytorch_2.10.0_a1_x86_64_builder:20260704"
  img_2_11_0_x86: "pytorch_2.11.0_a1_x86_64_builder:20260704"
  img_2_12_0_x86: "pytorch_2.12.0_a1_x86_64_builder:20260704"
  img_2_13_0_x86: "pytorch_2.13.0_a1_x86_64_builder:20260709"

permissions:
  project: read
  repository: read
  id-token: write
  pr: write
  note: write

stages:
  stage_1:
    name: only_doc
    select: selected_by_default
    jobs:
      Detect_file_changes:
        name: Detect_file_changes
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        outputs:
          need_build_ut: ${{ steps.set-skip.outputs.need_build_ut }}
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
              allow-unsafe-pr-checkout: true
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ atomgit.event.pull_request.base.ref }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              token: ${{ atomgit.token }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                non-doc:
                  - '!**/*.md'
                  - '!**/*.rst'
                  - '!**/*.log'
                  - '!**/*.png'
                  - '!**/*.jpg'
                  - '!**/*.doc'
                  - '!**/*.eddx'
                  - '!**/*.svg'

          - name: set build skip flag
            id: set-skip
            run: |
              echo "changed: ${{ steps.filter.outputs.changed_files }}"
              echo "non-doc: ${{ steps.filter.outputs.non-doc }}"
              if [ "${{ steps.filter.outputs.non-doc }}" = "true" ]; then
                echo "need_build_ut=yes" >> "$ATOMGIT_OUTPUT"
              else
                echo "need_build_ut=no" >> "$ATOMGIT_OUTPUT"
              fi
              echo "${{ steps.filter.outputs.changed_files }}" | tr -d '[]" ' | tr ',' '\n' > modify_files.txt
              cat modify_files.txt
          - name: upload modify_files.txt
            uses: upload-artifact
            with:
              name: modify_files.txt
              path: modify_files.txt
              overwrite: true

      associate_pr_comment:
        name: associate_pr_comment
        select: selected_by_default
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        steps:
          - name: associate-pr-comment
            uses: associate-pr-comment
          - name: pre_pipeline
            id: pre_pipeline
            uses: cann/.gitcode/actions/pre-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
            with:
              owner: ${{ env.org_name }}
              repo: ${{ atomgit.event.repository.name }}
              pr_number: ${{ atomgit.event.pull_request.number }}
              token: ${{ atomgit.token }}
              apply_label: 'true'
              run_url: https://gitcode.com/${{ env.org_name }}/${{ atomgit.event.repository.name }}/actions/runs/${{ atomgit.workflow_run_id }}

  stage_2:
    name: CodeCheck
    select: selected_by_default
    jobs:
      CodeCheck_pre_commit:
        name: pre-commit
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspore/mindspore_python3.11:v0.1
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              allow-unsafe-pr-checkout: true
          - name: setup-python311
            run: |
              PYTHON311_BIN=$(dirname "$(which python3.11)")
              ln -sf "$(which python3.11)" "$PYTHON311_BIN/python"
              echo "$PYTHON311_BIN" >> "$ATOMGIT_PATH"
              python --version
          - name: install gitleaks
            run: |
              cd ${ATOMGIT_WORKSPACE}
              wget --no-host-directories -c --no-check-certificate https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/gitleaks
              chmod +x gitleaks
              cd -
          - name: Run pre-commit
            uses: openlibing/pre-commit-action@v1.0.0

      sca-pr:
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        steps:
          - name: checkout
            uses: checkout
          - name: Run SCA PR scan
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: AscendForPyTorch

      malicious-scan:
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        steps:
          - name: checkout
            uses: checkout
          - name: Run malicious code scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              repository-name: ${{ atomgit.repository }}
              pr-id: "${{ atomgit.event.pull_request.number }}"
              project-name: AscendForPyTorch

  stage_3:
    name: Build
    select: selected_by_default
    jobs:
      Build:
        name: Build
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        uses: .gitcode/workflows/build_job.yml
        with:
          pytorch_branch: ${{ matrix.branch }}
          CP_DOCKER_IMG: ${{ matrix.img }}
          runs_on_arch: ${{ matrix.arch }}
          runs_on_spec: "cpu=32"
        strategy:
          matrix:
            include:
              - branch: "master"
                arch: "x86"
                img: "pytorch_master_a1_x86_64_builder:20260804"
              - branch: "v2.7.1"
                arch: "x86"
                img: "pytorch_2.7.1_a1_x86_64_builder:20260804"
              - branch: "v2.9.0"
                arch: "x86"
                img: "pytorch_2.9.0_a1_x86_64_builder:20260901"
              - branch: "v2.10.0"
                arch: "x86"
                img: "pytorch_2.10.0_a1_x86_64_builder:20260704"
              - branch: "v2.11.0"
                arch: "x86"
                img: "pytorch_2.11.0_a1_x86_64_builder:20260704"
              - branch: "v2.12.0"
                arch: "x86"
                img: "pytorch_2.12.0_a1_x86_64_builder:20260704"
              - branch: "master"
                arch: "arm"
                img: "pytorch_master_a2_aarch64_builder:20260804"
              - branch: "v2.7.1"
                arch: "arm"
                img: "pytorch_2.7.1_a2_aarch64_builder:20260804"
              - branch: "v2.9.0"
                arch: "arm"
                img: "pytorch_2.9.0_a2_aarch64_builder:20260901"
              - branch: "v2.10.0"
                arch: "arm"
                img: "pytorch_2.10.0_a2_aarch64_builder:20260804"
              - branch: "v2.11.0"
                arch: "arm"
                img: "pytorch_2.11.0_a2_aarch64_builder:20260804"
              - branch: "v2.12.0"
                arch: "arm"
                img: "pytorch_2.12.0_a2_aarch64_builder:20260804"


  stage_4:
    name: UT
    select: selected_by_default
    jobs:
      UT:
        name: UT
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        uses: .gitcode/workflows/ut_job.yml
        with:
          pytorch_branch: ${{ matrix.branch }}
          CP_DOCKER_IMG: ${{ matrix.img }}
          TEST_RANK: ${{ matrix.TEST_RANK || '1' }}
          TEST_WORLD_SIZE: ${{ matrix.TEST_WORLD_SIZE || '1' }}
        strategy:
          matrix:
            include:
              - branch: "master"
                img: "pytorch_master_a2_aarch64_builder:20260804"
                TEST_RANK: "1"
                TEST_WORLD_SIZE: "2"
              - branch: "master"
                img: "pytorch_master_a2_aarch64_builder:20260804"
                TEST_RANK: "2"
                TEST_WORLD_SIZE: "2"
              - branch: "v2.7.1"
                img: "pytorch_2.7.1_a2_aarch64_builder:20260804"
              - branch: "v2.9.0"
                img: "pytorch_2.9.0_a2_aarch64_builder:20260901"
              - branch: "v2.10.0"
                img: "pytorch_2.10.0_a2_aarch64_builder:20260804"
              - branch: "v2.11.0"
                img: "pytorch_2.11.0_a2_aarch64_builder:20260804"
              - branch: "v2.12.0"
                img: "pytorch_2.12.0_a2_aarch64_builder:20260804"

post:
  jobs:
    query_pipeline:
      steps:
        - name: query_pipeline
          id: query_pipeline
          uses: cann/.gitcode/actions/query-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
          with:
            owner: ${{ env.org_name }}
            repo: ${{ atomgit.event.repository.name }}
            run_id: ${{ atomgit.workflow_run_id }}
            token: ${{ atomgit.token }}
            pr_number: ${{ atomgit.event.pull_request.number }}
            apply_label: 'true'
